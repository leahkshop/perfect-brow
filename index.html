<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Perfect Brow — 눈썹 밸런스 가이드</title>
<meta name="description" content="PMU 아티스트를 위한 눈썹 대칭·밸런스 정밀 가이드 도구" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#5B7FD8" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Perfect Brow" />
<style>
/* ─────────────────────────────────────────────
   Perfect Brow — styles
   ───────────────────────────────────────────── */
:root{
  --bg:#ffffff;
  --surface:#f6f7f9;
  --surface-2:#eceef2;
  --fg:#16181d;
  --muted:#6b7280;
  --faint:#9099a6;
  --border:#dfe3e9;
  --primary:#5B7FD8;
  --primary-d:#4A6BC4;
  --accent:#7A6FD8;
  --danger:#e0433f;
  --btn-off:#4A4A4A;
  --stage:#1f2228;      /* 사진 캔버스 배경 — 피부톤이 정확히 읽히는 중성 다크 */
  --chrome:#fbfbfc;     /* 도구 영역 배경 */
  --panel-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font:inherit}

.screen{display:none;flex-direction:column;height:100dvh;height:100vh}
.screen.active{display:flex}

/* ── Home ───────────────────────────────── */
#home{padding:calc(var(--safe-t) + 8px) 20px calc(var(--safe-b) + 20px);overflow-y:auto;align-items:center}
.lang-switch{display:flex;gap:6px;justify-content:center;padding:8px 0 4px;width:100%}
.lang-switch button{padding:7px 18px;border-radius:8px;font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.lang-switch button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.home-inner{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:420px;margin:auto;width:100%;padding:12px 0 8px}
.hero{width:132px;height:132px;border-radius:32px;object-fit:cover;box-shadow:0 12px 34px rgba(91,127,216,.22);margin-bottom:22px}
.home-title{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:0 0 6px}
.home-sub{font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0}
.home-div{width:48px;height:2px;background:var(--border);margin:20px 0}
.home-desc{font-size:14.5px;line-height:1.65;color:var(--muted);margin:0 0 26px;white-space:pre-line}
.cta{width:100%;max-width:300px;height:54px;border-radius:14px;font-size:16.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#5B8DEE 0%,#6B5FD8 55%,#8B5FD8 100%);
  box-shadow:0 8px 22px rgba(107,95,216,.32);display:flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:translateY(1px);filter:brightness(.96)}
.cta.secondary{background:var(--surface);color:var(--fg);box-shadow:none;border:1px solid var(--border);height:46px;font-size:15px;margin-top:10px}
.home-foot{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:26px}
.install-tip{margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--muted);text-align:left;width:100%}
.install-tip b{color:var(--fg)}
/* 가로 화면 홈 압축 */
@media all{ /* 짧은 가로 화면 홈 압축 */
  body.land.compact #home{padding-top:calc(var(--safe-t) + 2px)}
  body.land.compact .lang-switch{padding:2px 0}
  body.land.compact .lang-switch button{padding:5px 14px;font-size:12px}
  body.land.compact .home-inner{padding:6px 0 4px;max-width:560px}
  body.land.compact .hero{width:76px;height:76px;border-radius:20px;margin-bottom:10px}
  body.land.compact .home-title{font-size:25px;margin-bottom:3px}
  body.land.compact .home-sub{font-size:10px}
  body.land.compact .home-div{margin:9px 0}
  body.land.compact .home-desc{font-size:12.5px;line-height:1.5;margin-bottom:14px}
  body.land.compact .cta{height:46px;font-size:15px;max-width:280px}
  body.land.compact .install-tip{margin-top:12px;padding:9px 12px;font-size:11.5px;line-height:1.5}
  body.land.compact .home-foot{margin-top:12px}
}

/* ── Editor ─────────────────────────────── */
/* 가로(landscape) 우선: 캔버스 왼쪽 전체 + 오른쪽 조절 열
   세로(portrait)에서도 그대로 동작하도록 grid-area 로 전환 */
#editor{background:var(--bg);display:none}
#editor.active{display:grid}
.stage{grid-area:stage}
/* v1.11.0 — 상단바·우측 패널 제거. 사진이 화면 전부를 쓰고 모든 컨트롤은 캔버스 오버레이.
   레이아웃은 기기 방향이 아니라 body 클래스로 결정한다 (app.js applyLayout()).
   .land = 가로 레이아웃 / .rot90 = 화면을 90° 돌려 가로 강제 / .compact = 짧은 화면 */
body:not(.land) #editor.active{grid-template-columns:100%;grid-template-rows:minmax(0,1fr);
  grid-template-areas:"stage"}
body:not(.land) #lineRail{display:none}

/* 가로: [왼쪽 라인 레일] [사진 — 나머지 전부] */
body.land #editor.active{grid-template-columns:62px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  grid-template-areas:"lines stage"}
body.land #lineRail{display:flex}

/* ── 화면 강제 가로 회전 ──────────────────────────────────
   기기가 세로로 잠겨 있어도(아이폰 PWA는 방향 고정 불가, 안드로이드 회전잠금)
   앱 전체를 90° 돌려 가로로 쓰게 한다.
   터치 좌표는 SVG getScreenCTM 으로 이 변환을 흡수하므로 드래그·핀치가 그대로 정확하다. */
body.rot90{overflow:hidden;position:fixed;inset:0}
body.rot90 .screen.active{
  position:fixed;top:0;left:0;
  width:100vh;height:100vw;
  width:100dvh;height:100dvw;
  transform-origin:0 0;
  transform:translateX(100vw) rotate(90deg);
  transform:translateX(100dvw) rotate(90deg);
  overflow:hidden;
}
body.rot90 #home.active{overflow-y:auto}
/* Stage */
.stage{position:relative;min-height:0;min-width:0;background:var(--stage);overflow:hidden;touch-action:none}
#photo{position:absolute;inset:0;margin:auto;transform-origin:50% 50%;will-change:transform;pointer-events:none;
  image-rendering:auto;display:block}
#guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#touch{position:absolute;inset:0;touch-action:none}

.ov{position:absolute;z-index:20}
.ov-tl{top:8px;left:8px}
.ov-tr{top:8px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{background:rgba(22,24,28,.62);color:#fff;border:1px solid rgba(255,255,255,.30);
  border-radius:8px;padding:6px 10px;font-size:10.5px;font-weight:700;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary)}
.chip.warn{background:rgba(224,67,63,.85)}

.linebar{position:absolute;bottom:8px;z-index:20;display:flex;gap:4px;background:rgba(30,30,34,.62);
  padding:4px;border-radius:11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);flex-wrap:wrap}
.linebar-left{left:6px;max-width:58%}
.linebar-right{right:6px;max-width:39%}
.lbtn{width:32px;height:32px;border-radius:8px;background:var(--btn-off);color:#fff;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid transparent;line-height:1.05;text-align:center;padding:0}
.lbtn.hidden-line{opacity:.42}
.lbtn.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}

.hud{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:40;background:rgba(20,20,24,.88);
  color:#fff;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:700;text-align:center;line-height:1.65;
  max-width:82%;border:1px solid rgba(255,255,255,.2);
  opacity:0;transition:opacity .18s;pointer-events:none}
.hud.show{opacity:1}

/* 아래는 좌·우 도크가 모두 차지하므로 AI 안내는 왼쪽 위 (all line 바로 아래) */
.aistatus{position:absolute;top:44px;left:8px;bottom:auto;transform:none;z-index:22;max-width:52%}

/* ── 캔버스 오버레이 컨트롤 (v1.12.0) ────────────────────────────
   오른쪽 도크 `.rdock`  : [↶ 되돌리기(크게)] + 위아래 드래그 바 — 오른쪽 끝 · 세로 중앙
   오른쪽아래 `.bdock`  : 사진보정 4버튼 / 좌우 드래그 바        — 오른쪽 끝 아래
   왼쪽아래   `.ldock`  : 사진변경·프리셋·눈가이드·사진저장·사진잠금  …띄어서…  초기화 */
.posctl{position:relative;z-index:30;display:flex;align-items:center;gap:6px;
  background:rgba(22,24,28,.60);border:1px solid rgba(255,255,255,.26);border-radius:13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:auto;padding:5px}
.posctl .pbtn{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);
  color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.22)}
.posctl .pbtn:active{background:var(--primary);border-color:var(--primary)}
.posctl .plabel{position:absolute;display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:rgba(22,24,28,.78);border:1px solid rgba(255,255,255,.24);border-radius:8px;
  padding:3px 8px;font-size:10.5px;font-weight:800;color:#fff;letter-spacing:.3px;
  right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.posctl .plabel b{color:#9ec2ff;font-variant-numeric:tabular-nums}
.posctl .pslot{position:relative;display:flex;align-items:center;justify-content:center}
.posctl input[type=range]{margin:0}
.posctl input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.28)}
.posctl input[type=range]::-moz-range-track{background:rgba(255,255,255,.28)}
/* 지금 조작 대상인 쪽을 테두리로 표시 — 숨기지는 않는다 */
.posctl.active{border-color:rgba(120,165,255,.85);box-shadow:0 0 0 1px rgba(120,165,255,.35)}
.posctl:not(.active){opacity:.86}

/* 오른쪽 도크 — 아래 도크 높이(--bdock)를 뺀 영역의 세로 한가운데 */
.rdock{position:absolute;right:8px;top:0;bottom:var(--bdock,152px);height:46%;min-height:180px;
  margin:auto 0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px}
.posctl.axis-v{flex-direction:column;flex:1;width:46px;min-height:0}
.posctl.axis-v .pslot{flex:1;width:34px}
.posctl.axis-v input[type=range]{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg)}

/* 오른쪽 아래 도크 — 사진보정 버튼 + 좌우 드래그 바 */
.bdock{position:absolute;right:8px;bottom:calc(var(--safe-b) + 8px);z-index:30;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:calc(100% - 16px)}

/* 왼쪽 아래 도크 — 메뉴 버튼 한 행 (v1.12.0) */
.ldock{position:absolute;left:8px;bottom:calc(var(--safe-b) + 8px);z-index:30;display:flex;align-items:flex-end;max-width:calc(100% - 16px)}
.menurow{flex-wrap:wrap}
body:not(.land) .ldock{bottom:calc(var(--safe-b) + 56px)}
.posctl.axis-h{flex-direction:row-reverse;width:min(46vw,430px);min-width:230px;height:46px}
.posctl.axis-h .pslot{flex:1;height:34px}
.posctl.axis-h input[type=range]{width:100%;height:34px}

/* 도크 버튼 공통 */
.dockbtn{height:34px;min-width:46px;border-radius:10px;background:rgba(22,24,28,.62);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:9.5px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex:0 0 auto;padding:0 6px}
.dockbtn i{font-style:normal;font-size:13px;line-height:1}
.dockbtn:active{background:var(--primary);border-color:var(--primary)}
/* 되돌리기 — 자주 쓰는 버튼이라 한 단계 크게 */
.dockbtn.big{height:48px;min-width:56px;font-size:10.5px;border-radius:12px;gap:2px}
.dockbtn.big i{font-size:19px}

.menurow{display:flex;gap:5px}
.menurow button{height:42px;min-width:58px;border-radius:10px;background:rgba(22,24,28,.62);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:9.5px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:0 8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.menurow button i{font-style:normal;font-size:14px;line-height:1}
.menurow button:active{background:var(--primary);border-color:var(--primary)}
.menurow button.on{background:var(--danger);border-color:var(--danger)}
.menurow button.eyeon{background:#ffffff;color:#111;border-color:#ffffff}
.menurow .gap{flex:0 0 auto;width:22px}

/* 사진 보정 모드 버튼 — 좌우 드래그 바 바로 위. 사진 잠금 시 반투명 + 잠김 */
.modebtns{display:flex;gap:5px;margin:0}
.modebtns button{height:30px;min-width:58px;border-radius:9px;background:rgba(22,24,28,.62);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:11px;font-weight:700;padding:0 10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modebtns button.on{background:var(--accent);border-color:#9a92f0;color:#fff}
.modebtns button:disabled{opacity:.30}

input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:40px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--surface-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--primary);
  border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.28);margin-top:-11px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--surface-2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--primary);border:3px solid #fff}
input[type=range]:disabled{opacity:.4}

button:disabled{opacity:.38;pointer-events:none}

/* 가로 모드: 라인 선택 버튼 = 왼쪽 세로 레일 (왼손 전용) */
#lineRail{grid-area:lines;background:var(--chrome);border-right:1px solid var(--border);
  flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(var(--safe-t) + 8px) 3px calc(var(--safe-b) + 8px);overflow-y:auto;min-height:0}
#lineRail .linebar{position:static;flex-direction:column;flex-wrap:nowrap;gap:3px;
  background:transparent;border:none;padding:0;max-width:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}
#lineRail .lbtn{width:52px;height:29px;font-size:9.5px;border-radius:7px}
#lineRail #hButtons{position:relative;padding-bottom:12px}
#lineRail #hButtons::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:1px;background:var(--border)}
/* V 기본구조 버튼은 라인 버튼 아래에 (v1.11.0) */
#railExtra{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:11px;width:100%}
#railExtra::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:1px;background:var(--border)}
#railExtra .chip{width:52px;padding:5px 3px;font-size:8.5px;line-height:1.15;white-space:normal;text-align:center}
body:not(.land) #railExtra{display:none}

/* Modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:80dvh;display:flex;flex-direction:column}
.modal h3{margin:0 0 12px;font-size:16px;font-weight:800}
.modal input[type=text]{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:15px;margin-bottom:12px;background:var(--surface);-webkit-user-select:text;user-select:text}
.modal-row{display:flex;gap:8px}
.modal-row button{flex:1;height:44px;border-radius:10px;font-size:14px;font-weight:700;background:var(--surface);border:1px solid var(--border)}
.modal-row button.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.plist{overflow-y:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.pitem{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--border)}
.pitem .nm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem button{padding:7px 10px;border-radius:8px;font-size:11.5px;font-weight:700;background:var(--surface);border:1px solid var(--border)}
.pitem button.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.pitem button.del{color:var(--danger)}
.pitem .badge{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 6px;border-radius:5px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 0}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 28px);transform:translateX(-50%) translateY(14px);
  background:rgba(20,20,24,.92);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
  z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 가로 화면이 낮을 때(아이폰 가로 등) 컨트롤 압축 */
@media all{
  body.land.compact #editor #lineRail{gap:7px;padding-top:5px;padding-bottom:5px}
  body.land.compact #editor #lineRail .linebar{gap:3px;padding:4px}
  body.land.compact #editor #lineRail .lbtn{width:56px;height:24px;font-size:9px}
  body.land.compact #editor #railExtra .chip{width:56px;padding:4px 3px;font-size:8px}
  body.land.compact #editor .chip{padding:5px 8px;font-size:10px}
  body.land.compact #editor .posctl{padding:4px;gap:5px}
  body.land.compact #editor .posctl .pbtn{width:30px;height:30px;font-size:14px}
  body.land.compact #editor .posctl.axis-v{width:40px}
  body.land.compact #editor .posctl.axis-v .pslot{width:30px}
  body.land.compact #editor .posctl.axis-h{height:40px;width:min(50vw,360px);min-width:196px}
  body.land.compact #editor .posctl.axis-h .pslot{height:30px}
  body.land.compact #editor .posctl.axis-h input[type=range]{height:30px}
  body.land.compact #editor .rdock{height:54%;min-height:124px;gap:6px}
  body.land.compact #editor .dockbtn{height:28px;font-size:8.5px}
  body.land.compact #editor .menurow button{height:36px;min-width:50px;font-size:8.5px;padding:0 6px}
  body.land.compact #editor .menurow .gap{width:14px}
  body.land.compact #editor .dockbtn.big{height:40px;min-width:48px;font-size:9px}
  body.land.compact #editor .dockbtn.big i{font-size:16px}
  body.land.compact #editor .ldock{bottom:calc(var(--safe-b) + 6px);left:6px}
  body.land.compact #editor .menurow button i{font-size:12px}
  body.land.compact #editor .modebtns button{height:26px;min-width:48px;font-size:10px;padding:0 7px}
  body.land.compact #editor .bdock{gap:5px;bottom:calc(var(--safe-b) + 6px)}
}
</style>
</head>
<body>

<!-- ═══════════ HOME ═══════════ -->
<section id="home" class="screen active">
  <div class="lang-switch">
    <button id="langKo" class="on">한국어</button>
    <button id="langEn">English</button>
  </div>
  <div class="home-inner">
    <img class="hero" src="./icon-512.png" alt="" />
    <h1 class="home-title" data-i18n="home_title">Perfect Brow</h1>
    <p class="home-sub" data-i18n="home_subtitle">전문가용 눈썹 디자인 도구</p>
    <div class="home-div"></div>
    <p class="home-desc" data-i18n="home_description"></p>
    <button class="cta" id="pickBtn"><span data-i18n="select_photo">사진 선택</span></button>
    <div class="install-tip" id="installTip"></div>
    <p class="home-foot" data-i18n="home_footer">Professional Eyebrow Measurement Tool</p>
  </div>
</section>

<!-- ═══════════ EDITOR ═══════════ -->
<section id="editor" class="screen">
  <div class="stage" id="stage">
    <img id="photo" alt="" />
    <svg id="guides" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="touch"></div>

    <div class="ov ov-tl">
      <button class="chip" id="btnAllLine">all line</button>
    </div>

    <div class="linebar linebar-left" id="hButtons"></div>
    <div class="linebar linebar-right" id="vButtons"></div>

    <!-- 오른쪽 도크 (v1.12.0) — 되돌리기(크게) + 위아래 드래그 바. 오른쪽 끝 · 세로 중앙 -->
    <div class="rdock" id="rightDock">
      <button class="dockbtn big" id="btnUndo"><i>↶</i><em data-i18n="editor_undo">되돌리기</em></button>
      <div class="posctl axis-v" id="posCtlV">
        <div class="plabel"><span id="selNameV">Eye</span><b id="posValV">50</b></div>
        <button class="pbtn" id="posPlusV">▲</button>
        <div class="pslot" id="pSlotV"><input type="range" id="posSliderV" min="0" max="1" step="0.0005" value="0.5" /></div>
        <button class="pbtn" id="posMinusV">▼</button>
      </div>
    </div>

    <!-- 아래 도크 (v1.11.0) — 사진보정 버튼 / 좌우 드래그 바 / 메뉴 버튼. 모두 오른쪽 정렬 -->
    <div class="bdock" id="bottomDock">
      <div class="modebtns" id="photoModes">
        <button data-mode="zoom" class="on" data-i18n="editor_zoom">줌</button>
        <button data-mode="vertical" data-i18n="editor_vertical">위아래</button>
        <button data-mode="horizontal" data-i18n="editor_horizontal">좌우</button>
        <button data-mode="balance" data-i18n="editor_balance">밸런스</button>
      </div>
      <div class="posctl axis-h" id="posCtlH">
        <div class="plabel"><span id="selNameH">Center</span><b id="posValH">50</b></div>
        <button class="pbtn" id="posPlusH">▶</button>
        <div class="pslot" id="pSlotH"><input type="range" id="posSliderH" min="0" max="1" step="0.0005" value="0.5" /></div>
        <button class="pbtn" id="posMinusH">◀</button>
      </div>
    </div>

    <!-- 왼쪽 아래 도크 (v1.12.0) — 메뉴 한 행. 초기화는 한 칸 띄어서 같은 행 -->
    <div class="ldock" id="leftDock">
      <div class="menurow" id="menuRow">
        <button id="btnChange"><i>🖼</i><em data-i18n="editor_change_photo">사진변경</em></button>
        <button id="btnPresetLoad"><i>☆</i><em data-i18n="editor_preset">프리셋</em></button>
        <button id="btnEyeGuide"><i>👁</i><em data-i18n="editor_eyeguide">눈가이드</em></button>
        <button id="btnExport"><i>⬇</i><em data-i18n="editor_export">사진저장</em></button>
        <button id="btnLock"><i>🔒</i><em id="lockLabel" data-i18n="editor_photo_lock">사진잠금</em></button>
        <span class="gap"></span>
        <button id="btnReset"><i>↺</i><em data-i18n="editor_reset">초기화</em></button>
      </div>
    </div>

    <div class="hud" id="hud"></div>
    <div class="ov aistatus"><span class="chip" id="aiStatus" hidden></span></div>
  </div>

  <aside id="lineRail">
    <div id="railExtra">
      <button class="chip" id="btnPivot" data-i18n="editor_inner_angle">V Center Pivot</button>
      <button class="chip" id="btnVAngle" data-i18n="editor_outer_angle">V Angle</button>
    </div>
  </aside>
</section>

<!-- ═══════════ MODALS ═══════════ -->
<div class="mask" id="mSave">
  <div class="modal">
    <h3 data-i18n="editor_preset_save">프리셋 저장</h3>
    <input type="text" id="saveName" maxlength="30" />
    <div class="modal-row">
      <button data-close="mSave" data-i18n="editor_cancel">취소</button>
      <button class="pri" id="doSave" data-i18n="editor_save">저장</button>
    </div>
  </div>
</div>

<div class="mask" id="mLoad">
  <div class="modal">
    <h3 data-i18n="editor_preset">프리셋</h3>
    <div class="plist" id="presetList"></div>
    <div class="modal-row">
      <button data-close="mLoad" data-i18n="editor_close">닫기</button>
      <button class="pri" id="btnPresetSave">＋ <span data-i18n="editor_preset_save">현재 설정 저장</span></button>
    </div>
  </div>
</div>

<div class="mask" id="mRename">
  <div class="modal">
    <h3 data-i18n="preset_rename">프리셋 이름 변경</h3>
    <input type="text" id="renameName" maxlength="30" />
    <div class="modal-row">
      <button data-close="mRename" data-i18n="editor_cancel">취소</button>
      <button class="pri" id="doRename" data-i18n="editor_save">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden />

<script src="./app.js"></script>
</body>
</html>
