<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Perfect Brow — 눈썹 밸런스 가이드</title>
<meta name="description" content="PMU 아티스트를 위한 눈썹 대칭·밸런스 정밀 가이드 도구" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#5B7FD8" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Perfect Brow" />
<style>
/* ─────────────────────────────────────────────
   Perfect Brow — styles
   ───────────────────────────────────────────── */
:root{
  /* ── v1.20.0 디자인 시스템 ─────────────────────────────────
     규칙 하나: **그라데이션과 글로우는 "지금 켜져 있는 모드"에만.**
     사진 위 가이드 선은 절대 발광하지 않는다 → 같은 파란 계열이어도 안 헷갈린다.
     왼쪽 레일(목록)은 담백하게, 오른쪽(조작 중인 것)만 켜진다. */
  --bg:#0A0C12;
  --surface:#11141C;
  --surface-2:#1A1F2A;
  --fg:#E8EDF7;
  --muted:#8B94A6;
  --faint:#5D6577;
  --border:rgba(255,255,255,.10);
  --hair:rgba(255,255,255,.10);      /* 유리 컨트롤 테두리 */
  --glass:rgba(255,255,255,.035);    /* 유리 컨트롤 바탕 */
  --a1:#22D3EE;                      /* 액센트 — 켜짐 */
  --a2:#67E8F9;                      /* 액센트 — 글자/아이콘 */
  --a2b:rgba(34,211,238,.42);        /* 액센트 — 흐린 테두리 */
  --grad:linear-gradient(135deg,#22D3EE 0%,#7C8CF8 55%,#A78BFA 100%);
  /* 밝은 그라데이션 위에는 어두운 글자(--on-accent). 흰 글자를 쓰고 싶으면 --grad-deep 을 쓰세요 */
  --grad-deep:linear-gradient(135deg,#0EA5C4 0%,#5566E0 55%,#8B5CF6 100%);
  --glow:rgba(90,180,255,.42);
  --on-accent:#04141B;                /* 시안 채움 위 글자 — 흰색은 대비가 안 나옵니다 */
  --primary:#22D3EE;
  --primary-d:#0EA5C4;
  --accent:#7C8CF8;
  --danger:#FF6B7A;
  --danger-b:rgba(255,107,122,.38);
  /* 초기화 전용 — 다른 붉은 표시(밸런스 어긋남)보다 **한 단계 짙게** (v1.28.1)
     같은 빨강을 쓰면 "고쳐야 할 곳"과 "전부 지우는 버튼"이 같은 무게로 보입니다 */
  --danger-d:#F0384C;
  --danger-db:rgba(240,56,76,.55);
  --btn-off:rgba(255,255,255,.03);
  --stage:#0A0C12;      /* 사진 캔버스 배경 — 피부톤이 정확히 읽히는 중성 다크 */
  --chrome:#0D1018;     /* 도구 영역 배경 — 흰색으로 되돌리지 마세요 (사진이 주인공) */
  --scrim:rgba(6,8,13,.96);
  --scrim-m:rgba(6,8,13,.62);
  --panel-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font:inherit}

.screen{display:none;flex-direction:column;height:100dvh;height:100vh}
.screen.active{display:flex}

/* ── Home ───────────────────────────────── */
#home{padding:calc(var(--safe-t) + 8px) 20px calc(var(--safe-b) + 20px);overflow-y:auto;align-items:center}
.lang-switch{display:flex;gap:6px;justify-content:center;padding:8px 0 4px;width:100%}
.lang-switch button{padding:7px 18px;border-radius:10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--hair)}
.lang-switch button.on{background:var(--a1);color:var(--on-accent);border-color:var(--a1);font-weight:700}
.home-inner{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:420px;margin:auto;width:100%;padding:12px 0 8px}
.hero{width:132px;height:132px;border-radius:32px;object-fit:cover;box-shadow:0 12px 40px var(--glow);margin-bottom:22px}
.home-title{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:0 0 6px}
.home-sub{font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0}
.home-div{width:48px;height:2px;background:var(--hair);margin:20px 0}
.home-desc{font-size:14.5px;line-height:1.65;color:var(--muted);margin:0 0 26px;white-space:pre-line}
.cta{width:100%;max-width:300px;height:54px;border-radius:16px;font-size:16.5px;font-weight:800;color:#fff;
  background:var(--grad-deep);
  box-shadow:0 10px 30px var(--glow);display:flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:translateY(1px);filter:brightness(.96)}
.cta.secondary{background:rgba(255,255,255,.05);color:var(--fg);box-shadow:none;border:1px solid var(--hair);height:46px;font-size:15px;margin-top:10px}
.home-foot{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:26px}
.install-tip{margin-top:22px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--muted);text-align:left;width:100%}
.install-tip b{color:var(--fg)}
/* 가로 화면 홈 압축 */
@media all{ /* 짧은 가로 화면 홈 압축 */
  body.land.compact #home{padding-top:calc(var(--safe-t) + 2px)}
  body.land.compact .lang-switch{padding:2px 0}
  body.land.compact .lang-switch button{padding:5px 14px;font-size:12px}
  body.land.compact .home-inner{padding:6px 0 4px;max-width:560px}
  body.land.compact .hero{width:76px;height:76px;border-radius:20px;margin-bottom:10px}
  body.land.compact .home-title{font-size:25px;margin-bottom:3px}
  body.land.compact .home-sub{font-size:10px}
  body.land.compact .home-div{margin:9px 0}
  body.land.compact .home-desc{font-size:12.5px;line-height:1.5;margin-bottom:14px}
  body.land.compact .cta{height:46px;font-size:15px;max-width:280px}
  body.land.compact .install-tip{margin-top:12px;padding:9px 12px;font-size:11.5px;line-height:1.5}
  body.land.compact .home-foot{margin-top:12px}
}

/* ── Editor ─────────────────────────────── */
/* 가로(landscape) 우선: 캔버스 왼쪽 전체 + 오른쪽 조절 열
   세로(portrait)에서도 그대로 동작하도록 grid-area 로 전환 */
#editor{background:var(--bg);display:none}
#editor.active{display:grid}
.stage{grid-area:stage}
/* v1.11.0 — 상단바·우측 패널 제거. 사진이 화면 전부를 쓰고 모든 컨트롤은 캔버스 오버레이.
   레이아웃은 기기 방향이 아니라 body 클래스로 결정한다 (app.js applyLayout()).
   .land = 가로 레이아웃 / .rot90 = 화면을 90° 돌려 가로 강제 / .compact = 짧은 화면 */
body:not(.land) #editor.active{grid-template-columns:100%;grid-template-rows:minmax(0,1fr);
  grid-template-areas:"stage"}
body:not(.land) #lineRail{display:none}

/* 가로: [왼쪽 라인 레일] [사진 — 나머지 전부] */
body.land #editor.active{grid-template-columns:62px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  grid-template-areas:"lines stage"}
body.land #lineRail{display:flex}

/* ── 화면 강제 가로 회전 ──────────────────────────────────
   기기가 세로로 잠겨 있어도(아이폰 PWA는 방향 고정 불가, 안드로이드 회전잠금)
   앱 전체를 90° 돌려 가로로 쓰게 한다.
   터치 좌표는 SVG getScreenCTM 으로 이 변환을 흡수하므로 드래그·핀치가 그대로 정확하다. */
body.rot90{overflow:hidden;position:fixed;inset:0}
body.rot90 .screen.active{
  position:fixed;top:0;left:0;
  width:100vh;height:100vw;
  width:100dvh;height:100dvw;
  transform-origin:0 0;
  transform:translateX(100vw) rotate(90deg);
  transform:translateX(100dvw) rotate(90deg);
  overflow:hidden;
}
body.rot90 #home.active{overflow-y:auto}
/* ── 사진 선택 중 (v1.27.0) ────────────────────────────────
   iOS 사진 시트는 OS 가 그려서 늘 **기기 방향(세로)** 으로 뜬다.
   그렇다고 앱까지 세로로 되돌리면 "지금 가로인가 세로인가"가 헷갈린다.
   **앱은 가로 그대로 두고 화면만 어둡게 낮춰** 시트가 주인공이 되게 한다.
   딤은 레이아웃을 건드리지 않으므로 시트를 닫으면 그대로 돌아온다. */
body.picking .screen.active::after{
  content:"";position:absolute;inset:0;z-index:60;pointer-events:none;
  background:rgba(0,0,0,.55)}
/* Stage */
/* --redge : 오른쪽 컨트롤이 화면 오른쪽 끝에서 떨어지는 거리 (v1.13.0)
   아이폰은 화면 맨 오른쪽 가장자리가 시스템 스와이프 영역이라 컨트롤이 눌리지 않는다.
   강제 가로(rot90)에서는 앱의 오른쪽 끝 = 기기의 아래쪽 = 홈 인디케이터 자리이므로
   safe-area-inset-bottom 을 더 빼 준다. */
.stage{position:relative;min-height:0;min-width:0;background:var(--stage);overflow:hidden;touch-action:none;
  --redge:calc(5% + 8px)}
body.rot90 .stage{--redge:calc(5% + 8px + env(safe-area-inset-bottom,0px))}
#photo{position:absolute;inset:0;margin:auto;transform-origin:50% 50%;will-change:transform;pointer-events:none;
  image-rendering:auto;display:block}
/* 컨트롤이 놓이는 아래·오른쪽을 어둡게 깔아 사진이 주인공이 되게 한다 (v1.16.0).
   불투명 띠로 만들면 사진 영역을 영구히 잃으므로 가장자리만 진한 그라데이션으로 처리. */
.scrim{position:absolute;pointer-events:none;z-index:1}
.scrim-b{left:0;right:0;bottom:0;height:calc(var(--bdock,120px) + 30px);
  background:linear-gradient(to top,var(--scrim) 0%,var(--scrim) 45%,var(--scrim-m) 74%,rgba(6,8,13,0) 100%)}
.scrim-r{top:0;bottom:0;right:0;width:calc(var(--redge) + 62px);
  background:linear-gradient(to left,var(--scrim) 0%,var(--scrim-m) 55%,rgba(6,8,13,0) 100%)}
#guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#touch{position:absolute;inset:0;touch-action:none;z-index:3}

.ov{position:absolute;z-index:20}
.ov-tl{top:8px;left:8px;display:flex;gap:6px;align-items:center}
.ov-tr{top:8px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
/* 밸런스 (v1.29.0) — 위쪽 **중앙에서 약간 왼쪽**. 왼쪽 칩 줄과 떨어뜨려
   "선을 다루는 것들"과 "판정"을 눈으로 구분합니다. */
.ov-bal{top:8px;left:42%;transform:translateX(-50%);display:flex;gap:6px;align-items:center}
.refwrap{display:flex;gap:4px;align-items:center}
/* 기준 쪽 — **왼쪽/오른쪽을 각각** 둡니다. 토글 하나면 지금 어느 쪽인지 눌러 보기 전엔 모릅니다 */
.chip.ref{padding:5px 9px;font-size:10px;opacity:.72}
.chip.ref.on{background:var(--grad);border-color:var(--a1);color:var(--on-accent);font-weight:800;
  box-shadow:0 0 14px var(--glow);opacity:1}
.chip{background:var(--glass);color:rgba(255,255,255,.82);border:1px solid var(--hair);
  border-radius:11px;padding:6px 10px;font-size:10.5px;font-weight:700;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 4px 18px rgba(0,0,0,.35);white-space:nowrap}
.chip.on{background:var(--grad);border-color:var(--a1);color:var(--on-accent);font-weight:800;box-shadow:0 0 18px var(--glow)}
.chip.warn{background:rgba(255,107,122,.16);border-color:var(--danger-b);color:var(--danger)}
/* 초기화 (v1.28.1) — 위험 등급. **오른쪽 도크 맨 위**, `다시 실행` 과 한 칸 띄웁니다.
   붙여 두면 되돌리려다 전부 지웁니다. 색도 한 단계 짙은 빨강으로 분리합니다. */
.dockbtn.danger{color:var(--danger-d);border-color:var(--danger-db);background:rgba(240,56,76,.12)}
.dockbtn.danger:active{background:rgba(240,56,76,.22)}
.rgap{flex:0 0 auto;height:16px}
body.land.compact .rgap{height:11px}

.linebar{position:absolute;bottom:8px;z-index:20;display:flex;gap:4px;background:rgba(13,16,24,.62);
  padding:4px;border-radius:11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);flex-wrap:wrap}
.linebar-left{left:6px;max-width:58%}
.linebar-right{right:6px;max-width:39%}
/* ── 라인 버튼 (v1.20.0) — 왼쪽 레일은 "목록"이라 담백하게. 발광·그라데이션 금지 ──
   왼쪽 색 띠 = 그 선의 실제 색 (어느 선인지) / 채움+굵은 글씨 = 선택됨 (지금 움직일 것)
   두 정보가 서로 다른 자리에 있어 충돌하지 않는다. 버튼 전체를 선 색으로 칠하지 마세요. */
.lbtn{position:relative;overflow:hidden;width:32px;height:32px;border-radius:9px;
  background:rgba(255,255,255,.03);color:rgba(255,255,255,.62);font-size:9px;font-weight:600;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.07);
  line-height:1.05;text-align:center;padding:0 0 0 9px}
.lbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;
  background:var(--dot,#8B94A6);opacity:.75}
.lbtn.hidden-line{background:transparent;color:rgba(255,255,255,.34)}
.lbtn.hidden-line::before{opacity:.22}
.lbtn.sel{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.30);
  color:#fff;font-weight:750}
.lbtn.sel::before{width:5px;opacity:1}

.hud{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:40;background:rgba(20,20,24,.88);
  color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:center;line-height:1.65;
  max-width:82%;border:1px solid var(--hair);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;transition:opacity .18s;pointer-events:none}
.hud.show{opacity:1}

/* 아래는 좌·우 도크가 모두 차지하므로 AI 안내는 왼쪽 위 (all line 바로 아래) */
.aistatus{position:absolute;top:44px;left:8px;bottom:auto;transform:none;z-index:22;max-width:52%}

/* ── 캔버스 오버레이 컨트롤 (v1.12.0) ────────────────────────────
   오른쪽 도크 `.rdock`  : [↶ 되돌리기(크게)] + 위아래 드래그 바 — 오른쪽 끝 · 세로 중앙
   오른쪽아래 `.bdock`  : 사진보정 4버튼 / 좌우 드래그 바        — 오른쪽 끝 아래
   왼쪽아래   `.ldock`  : 사진변경·프리셋·눈가이드·사진저장·사진잠금  …띄어서…  초기화 */
.posctl{position:relative;z-index:30;display:flex;align-items:center;gap:6px;
  background:var(--glass);border:1px solid var(--hair);border-radius:16px;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 8px 30px rgba(0,0,0,.45);touch-action:auto;padding:5px}
.posctl .pbtn{flex:0 0 auto;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.06);
  color:var(--a2);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--hair)}
.posctl .pbtn:active{background:var(--primary);border-color:var(--primary)}
.posctl .plabel{position:absolute;display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:transparent;border:none;border-radius:8px;
  padding:3px 8px;font-size:10.5px;font-weight:800;color:#fff;letter-spacing:.3px;
  right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.posctl .plabel b{color:var(--a2);font-variant-numeric:tabular-nums}
.posctl .pslot{position:relative;display:flex;align-items:center;justify-content:center}
.posctl input[type=range]{margin:0}
.posctl input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.28)}
.posctl input[type=range]::-moz-range-track{background:rgba(255,255,255,.28)}
/* 지금 조작 대상인 쪽을 테두리로 표시 — 숨기지는 않는다 */
/* 지금 조작 중인 조절자만 켜진다 — 글로우는 여기와 사진잠금에만 (디자인 규칙) */
.posctl.active{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1) inset,0 8px 34px var(--glow)}
.posctl:not(.active){opacity:.86}

/* 오른쪽 도크 — 아래 도크 높이(--bdock)를 뺀 영역의 세로 한가운데 */
.rdock{position:absolute;right:var(--redge);top:0;bottom:var(--bdock,152px);height:56%;min-height:200px;
  margin:auto 0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px}
.posctl.axis-v{flex-direction:column;flex:1;width:46px;min-height:0}
.posctl.axis-v .pslot{flex:1;width:34px}
.posctl.axis-v input[type=range]{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg)}
/* 값 라벨은 바 **오른쪽** 여백(--redge)에 세로로 쌓아 둔다 (v1.15.0)
   왼쪽에 두면 사진(눈썹 작업 영역)을 가린다. 폭이 좁으므로 줄바꿈 허용. */
.posctl.axis-v .plabel{left:calc(100% + 6px);right:auto;flex-direction:column;gap:0;
  width:42px;padding:3px 4px;text-align:center;align-items:center;justify-content:center;
  white-space:normal;line-height:1.2;overflow-wrap:anywhere;font-size:9.5px}

/* 오른쪽 아래 도크 — 사진보정 버튼 + 좌우 드래그 바 */
.bdock{position:absolute;right:var(--redge);bottom:calc(var(--safe-b) + 8px);z-index:30;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:calc(100% - 16px)}
/* 되돌리기·다시실행은 **좌우 드래그 바 왼쪽**, 같은 행 (v1.29.0)
   되돌리기를 바에 가장 가깝게 — 제일 자주 누르는 버튼입니다. */
.barrow{display:flex;align-items:center;gap:6px}

/* 왼쪽 아래 도크 — 프리셋 + 즐겨찾기 (v1.12.0 · v1.28.0) */
.ldock{position:absolute;left:8px;bottom:calc(var(--safe-b) + 8px);z-index:30;display:flex;align-items:flex-end;gap:5px;max-width:calc(100% - 16px)}
.menurow{flex-wrap:wrap}
body:not(.land) .ldock{bottom:calc(var(--safe-b) + 56px)}
/* 가운데 아래 도크 — `사진잠금` 의 **가로 중심이 캔버스 한가운데**에 오도록 놓습니다 (v1.28.0).
   left:50% 로 묶음을 놓고 잠금 버튼의 절반만큼 되돌리는 방식이라 버튼 개수가 바뀌어도 중심이 유지됩니다. */
.cdock{position:absolute;left:50%;bottom:calc(var(--safe-b) + 8px);z-index:30;display:flex;align-items:flex-end;
  transform:translateX(-100%) translateX(34px)}
body.land.compact .cdock{transform:translateX(-100%) translateX(26px)}
/* 세로 폴백은 폭이 좁아 가운데 도크가 왼쪽 도크 위로 올라탑니다.
   유지보수 대상은 아니지만 **버튼이 서로 가려 눌리지 않으면 안 되므로** 한 줄 위로 올립니다. */
body:not(.land) .cdock{bottom:calc(var(--safe-b) + 112px)}
/* 즐겨찾기 버튼 (v1.29.0) — **프리셋 버튼보다 낮고 길쭉하게.**
   크기 차이로 "프리셋에 딸린 목록"임을 표현합니다. 프리셋 버튼 크기는 그대로 둡니다.
   **폭을 반드시 제한하세요** — 프리셋 이름은 원장님이 직접 지으시므로 길어질 수 있고,
   그대로 두면 왼쪽 묶음이 가운데까지 밀고 들어옵니다 (회귀 83번). */
.favrow{align-items:flex-end}
/* `.menurow button` 이 뒤에 선언되므로 특이도를 한 단계 올립니다 */
.menurow.favrow button{height:34px;min-width:58px;max-width:88px;border-radius:10px;
  flex-direction:row;gap:4px;padding:0 8px;font-size:9px}
.menurow.favrow button i, .menurow.favrow button i svg{width:12px;height:12px;color:var(--a2)}
.menurow.favrow button em{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.land.compact #editor .menurow.favrow button{height:30px;min-width:50px;max-width:74px;padding:0 6px;font-size:8.5px}
body.land.compact #editor .favrow button i, body.land.compact #editor .favrow button i svg{width:11px;height:11px}
/* 좌우 드래그 바 — 가운데 도크와 겹치지 않는 선까지만 넓힙니다 (v1.28.0).
   넓히면 사진잠금 위로 올라타고, 회귀 83번이 그것을 잡습니다. */
.posctl.axis-h{flex-direction:row-reverse;width:min(26vw,300px);min-width:140px;height:46px}
.posctl.axis-h .pslot{flex:1;height:34px;min-width:0}
.posctl.axis-h input[type=range]{width:100%;height:34px}
/* 가로 바의 라벨은 바 안쪽 왼쪽 끝에 둔다 — 바깥에 두면 왼쪽 아래 메뉴 행과 겹친다 (v1.13.0) */
.posctl.axis-h .plabel{position:static;transform:none;right:auto;top:auto;order:1;flex:0 0 auto;
  min-width:72px;justify-content:center;background:transparent;border:none;padding:0 4px}

/* 도크 버튼 공통 */
.dockbtn{height:34px;min-width:46px;border-radius:13px;background:var(--glass);
  border:1px solid var(--hair);color:rgba(255,255,255,.80);font-size:9.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 4px 18px rgba(0,0,0,.35);
  flex:0 0 auto;padding:0 6px}
.dockbtn:active{background:rgba(255,255,255,.10)}
/* 되돌리기·다시실행은 쓸 수 있을 때만 액센트로 살아난다 */
#btnUndo:not(:disabled), #btnRedo:not(:disabled){color:var(--a2);border-color:var(--a2b)}
/* 되돌리기 — 자주 쓰는 버튼이라 한 단계 크게 */
.dockbtn.big{height:48px;min-width:56px;font-size:10.5px;border-radius:14px;gap:3px}

.menurow{display:flex;gap:5px}
.menurow button{height:50px;min-width:68px;border-radius:13px;background:var(--glass);
  border:1px solid var(--hair);color:rgba(255,255,255,.80);font-size:9.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 4px 18px rgba(0,0,0,.35);
  padding:0 8px}
.menurow button:active{background:rgba(255,255,255,.10)}
/* ── 버튼 위계 (v1.20.0) — 다 똑같이 생기면 아무것도 안 중요해 보인다 ──
   주요 : 사진잠금(모드 스위치·제일 자주 씀) · 사진저장(결과물)
   보조 : 나머지 (위 기본형)
   위험 : 초기화 — 붉은 톤으로 분리해 실수로 누르는 걸 막는다 */
#btnLock{border-color:var(--a2b);color:var(--a2)}
#btnLock.on{border-color:var(--a1);color:var(--on-accent);background:var(--grad);
  box-shadow:0 0 0 1px var(--a1) inset,0 6px 22px var(--glow)}
#btnExport{border-color:var(--a2);color:var(--a2)}
/* 프리셋 적용 중 (v1.25.0) — 지금 화면의 선이 저장된 디자인이라는 표시 */
#btnPresetLoad.preset-on{border-color:var(--a1);color:var(--on-accent);background:var(--grad);
  box-shadow:0 0 0 1px var(--a1) inset,0 6px 22px var(--glow)}

/* 사진 보정 모드 버튼 — 좌우 드래그 바 바로 위. 사진 잠금 시 반투명 + 잠김 */
.modebtns{display:flex;gap:5px;margin:0}
.modebtns button{height:30px;min-width:58px;border-radius:11px;background:var(--glass);
  border:1px solid var(--hair);color:rgba(255,255,255,.72);font-size:11px;font-weight:700;padding:0 10px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modebtns button.on{background:var(--grad);border-color:var(--a1);color:var(--on-accent);font-weight:800;
  box-shadow:0 0 16px var(--glow)}
.modebtns button:disabled{opacity:.30}

input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:40px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--a1);
  border:none;box-shadow:0 0 14px var(--glow),0 1px 5px rgba(0,0,0,.4);margin-top:-11px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--a1);border:none}
input[type=range]:disabled{opacity:.4}

button:disabled{opacity:.38;pointer-events:none}

/* 가로 모드: 라인 선택 버튼 = 왼쪽 세로 레일 (왼손 전용) */
#lineRail{grid-area:lines;background:var(--chrome);border-right:1px solid var(--hair);
  flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(var(--safe-t) + 8px) 3px calc(var(--safe-b) + 8px);overflow-y:auto;min-height:0}
#lineRail .linebar{position:static;flex-direction:column;flex-wrap:nowrap;gap:3px;
  background:transparent;border:none;padding:0;max-width:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}
#lineRail .lbtn{width:52px;height:29px;font-size:9.5px;border-radius:7px}
#lineRail #hButtons{position:relative;padding-bottom:12px}
#lineRail #hButtons::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:1px;background:var(--hair)}
/* V 기본구조 버튼은 라인 버튼 아래에 (v1.11.0) */
#railExtra{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:11px;width:100%}
#railExtra::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:1px;background:var(--hair)}
#railExtra .chip{width:52px;padding:5px 3px;font-size:8.5px;line-height:1.15;white-space:normal;text-align:center}
/* 레일 안(목록)은 담백하게 — 그라데이션·글로우를 쓰지 마세요 (디자인 규칙) */
#lineRail .chip{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07);
  color:rgba(255,255,255,.62);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#lineRail .chip.on{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.30);
  color:#fff;box-shadow:none}
body:not(.land) #railExtra{display:none}
/* 한/영 (v1.19.0) — 왼쪽 버튼들 맨 위. 현재 언어만 색이 켜진다 */
#railLang{position:relative;display:flex;gap:4px;width:100%;justify-content:center;padding-bottom:11px}
#railLang::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:1px;background:var(--hair)}
#railLang button{width:24px;height:24px;border-radius:8px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;padding:0}
#railLang button.on{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.30);color:#fff}
body:not(.land) #railLang{display:none}

/* Modal */
/* ── Modal (v1.20.1) ─ 앱 전체가 다크이므로 모달도 다크. `background:#fff` 로 되돌리지 마세요
   — 글자색이 --fg(밝은색)라 흰 바탕에서 아예 안 보입니다.
   한 모달에 **채운 버튼은 하나만** (주 동작). 나머지는 테두리/유리로 두어야 조화롭습니다. */
.mask{position:fixed;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--hair);
  border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:80dvh;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.65)}
.modal h3{margin:0 0 14px;font-size:16px;font-weight:800;color:var(--fg)}
.modal input[type=text]{width:100%;height:46px;border:1px solid var(--hair);border-radius:12px;padding:0 12px;
  font-size:15px;margin-bottom:12px;background:rgba(255,255,255,.05);color:var(--fg);
  -webkit-user-select:text;user-select:text}
.modal input[type=text]:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 1px var(--a1) inset}
.modal input[type=text]::placeholder{color:var(--faint)}
.modal-row{display:flex;gap:8px}
/* 보조 = 유리 */
.modal-row button{flex:1;height:46px;border-radius:12px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.05);color:var(--fg);border:1px solid var(--hair)}
/* 주 동작 = 이 모달에서 딱 하나. 시안 채움 위에는 **어두운 글자** (흰 글자는 대비 부족) */
.modal-row button.pri{background:var(--a1);color:var(--on-accent);border-color:var(--a1);font-weight:800}
.modal-row button:active{background:rgba(255,255,255,.11)}
.modal-row button.pri:active{filter:brightness(.92)}
.plist{overflow-y:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.pitem{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--hair)}
.pitem .nm{flex:1;font-size:14px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 목록 안 버튼은 전부 테두리형 — 줄마다 채운 버튼이 있으면 화면이 시끄러워집니다 */
.pitem button{padding:8px 11px;border-radius:9px;font-size:11.5px;font-weight:700;
  background:transparent;color:var(--muted);border:1px solid var(--hair)}
.pitem button.pri{background:transparent;color:var(--a2);border-color:var(--a2b)}
.pitem button.del{background:transparent;color:var(--danger);border-color:var(--danger-b)}
.pitem button:active{background:rgba(255,255,255,.08)}
.pitem .badge{font-size:9.5px;font-weight:700;color:var(--faint);background:rgba(255,255,255,.06);
  border:1px solid var(--hair);padding:3px 7px;border-radius:6px}
/* ★ 즐겨찾기 토글 (v1.28.0) — 켜면 캔버스 왼쪽 아래에 버튼으로 나옵니다.
   테두리 없는 아이콘이라 목록의 다른 버튼(로드·수정·삭제)과 역할이 섞이지 않습니다. */
.pitem .star{flex:0 0 auto;width:30px;height:30px;padding:0;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--faint)}
.pitem .star svg{width:19px;height:19px}
.pitem .star.on{color:var(--a2)}
.pitem .star:active{background:rgba(255,255,255,.08);border-radius:8px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 0}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 28px);transform:translateX(-50%) translateY(14px);
  background:rgba(13,16,24,.94);border:1px solid var(--hair);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:#fff;padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;
  z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 가로 화면이 낮을 때(아이폰 가로 등) 컨트롤 압축 */
@media all{
  body.land.compact #editor #lineRail{gap:7px;padding-top:5px;padding-bottom:5px}
  body.land.compact #editor #lineRail .linebar{gap:3px;padding:4px}
  body.land.compact #editor #lineRail .lbtn{width:56px;height:24px;font-size:9px}
  body.land.compact #editor #railExtra .chip{width:56px;padding:4px 3px;font-size:8px}
  body.land.compact #editor .chip{padding:5px 8px;font-size:10px}
  body.land.compact #editor .posctl{padding:4px;gap:5px}
  body.land.compact #editor .posctl .pbtn{width:30px;height:30px;font-size:14px}
  body.land.compact #editor .posctl.axis-v{width:40px}
  body.land.compact #editor .posctl.axis-v .pslot{width:30px}
  body.land.compact #editor .posctl.axis-h{height:40px;width:min(22vw,186px);min-width:140px}
  body.land.compact #editor .posctl.axis-h .pslot{height:30px}
  body.land.compact #editor .posctl.axis-h .plabel{min-width:60px;font-size:9.5px}
  body.land.compact #editor .posctl.axis-v .plabel{width:34px;font-size:8.5px;padding:2px 3px}
  body.land.compact #editor .posctl.axis-h input[type=range]{height:30px}
  body.land.compact #editor .rdock{height:66%;min-height:150px;gap:5px}
  body.land.compact #editor .dockbtn{height:28px;font-size:8.5px}
  body.land.compact #editor .menurow button{height:46px;min-width:52px;font-size:9px;padding:0 6px}
  body.land.compact #editor .dockbtn.big{height:40px;min-width:48px;font-size:9px}
  body.land.compact #editor .ldock{bottom:calc(var(--safe-b) + 6px);left:6px}
  /* 가로 화면은 세로가 짧아 모달이 잘린다 — 더 넓고 촘촘하게 (v1.20.1) */
  body.land.compact .modal{max-width:560px;max-height:88dvh;padding:14px;border-radius:16px}
  body.land.compact .modal h3{margin-bottom:10px;font-size:15px}
  body.land.compact .modal .pitem{padding:7px 0}
  body.land.compact .modal input[type=text]{height:42px;margin-bottom:10px}
  body.land.compact .modal-row button{height:42px}
  body.land.compact #editor .scrim-b{height:calc(var(--bdock,110px) + 22px)}
  body.land.compact #editor .scrim-r{width:calc(var(--redge) + 50px)}
  body.land.compact #editor .menurow button i, body.land.compact #editor .menurow button i svg{width:17px;height:17px}
  body.land.compact #editor .dockbtn i, body.land.compact #editor .dockbtn i svg{width:16px;height:16px}
  body.land.compact #editor .dockbtn.big i, body.land.compact #editor .dockbtn.big i svg{width:19px;height:19px}
  body.land.compact #editor .modebtns button{height:26px;min-width:48px;font-size:10px;padding:0 7px}
  body.land.compact #editor .bdock{gap:5px;bottom:calc(var(--safe-b) + 6px)}
}
</style>
</head>
<body>

<!-- ═══════════ HOME ═══════════ -->
<section id="home" class="screen active">
  <div class="lang-switch">
    <button id="langKo" class="on">한국어</button>
    <button id="langEn">English</button>
  </div>
  <div class="home-inner">
    <img class="hero" src="./icon-512.png" alt="" />
    <h1 class="home-title" data-i18n="home_title">Perfect Brow</h1>
    <p class="home-sub" data-i18n="home_subtitle">전문가용 눈썹 디자인 도구</p>
    <div class="home-div"></div>
    <p class="home-desc" data-i18n="home_description"></p>
    <button class="cta" id="pickBtn"><span data-i18n="select_photo">사진 선택</span></button>
    <div class="install-tip" id="installTip"></div>
    <p class="home-foot" data-i18n="home_footer">Professional Eyebrow Measurement Tool</p>
  </div>
</section>

<!-- ═══════════ EDITOR ═══════════ -->
<section id="editor" class="screen">
  <div class="stage" id="stage">
    <img id="photo" alt="" />
    <!-- 컨트롤 영역 어둡게 (v1.16.0) — 가이드 SVG 보다 아래에 두어 선은 그대로 밝게 보인다 -->
    <div class="scrim scrim-b"></div>
    <div class="scrim scrim-r"></div>
    <svg id="guides" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="touch"></div>

    <div class="ov ov-tl">
      <button class="chip" id="btnAllLine" data-i18n="editor_all_hide">모든 라인 숨김</button>
      <button class="chip" id="btnMulti" data-i18n="editor_multi">여러라인</button>
      <!-- 여러라인의 후속 버튼 (v1.19.0) — 여러라인이 꺼져 있으면 hidden -->
      <button class="chip" id="btnAllSel" data-i18n="editor_all_lines" hidden>전체라인</button>
    </div>

    <!-- 밸런스 (v1.26.0 · 자리 v1.29.0) — 위쪽 **중앙에서 약간 왼쪽**.
         기준 쪽은 후속 버튼이라 밸런스를 켜야 나오고, **왼쪽/오른쪽을 각각 눌러** 고릅니다
         (토글 하나면 지금 어느 쪽이 기준인지 눌러 보기 전엔 모릅니다). -->
    <div class="ov ov-bal">
      <!-- 그린 선에 다시 맞추기 (v1.30.0) — 드로잉을 더 그린 뒤 누르면 자가 다시 올라갑니다 -->
      <button class="chip" id="btnSnap" data-i18n="ai_redraw">드로잉 맞춤</button>
      <button class="chip" id="btnBalance" data-i18n="editor_balance_check">밸런스</button>
      <span class="refwrap" id="refWrap" hidden>
        <button class="chip ref" id="btnRefL" data-i18n="bal_left">왼쪽</button>
        <button class="chip ref" id="btnRefR" data-i18n="bal_right">오른쪽</button>
      </span>
    </div>

    <div class="linebar linebar-left" id="hButtons"></div>
    <div class="linebar linebar-right" id="vButtons"></div>

    <!-- 오른쪽 도크 (v1.12.0) — 되돌리기(크게) + 위아래 드래그 바. 오른쪽 끝 · 세로 중앙
         v1.28.0 — 맨 위에 `사진변경`. 위아래 드래그 바 위쪽 끝선 위입니다. -->
    <div class="rdock" id="rightDock">
      <!-- 초기화 (v1.28.1) — 오른쪽 도크 맨 위. `다시 실행` 과 한 칸 띄우고 짙은 빨강으로 분리합니다.
           위쪽 끝은 시술 중 손이 잘 가지 않는 자리라 실수로 눌릴 일이 적습니다. -->
      <button class="dockbtn danger" id="btnReset"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5v5h5"/><path d="M4.2 10.5A8.2 8.2 0 1 1 4 14.6"/></svg></i><em data-i18n="editor_reset">초기화</em></button>
      <span class="rgap"></span>
      <button class="dockbtn" id="btnChange"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M3 16.5l4.8-4.2a2 2 0 0 1 2.7 0L21 20"/></svg></i><em data-i18n="editor_change_photo">사진변경</em></button>
      <button class="dockbtn" id="btnExport"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="M8 11l4 4 4-4"/><path d="M4 16.5v2.2a1.8 1.8 0 0 0 1.8 1.8h12.4a1.8 1.8 0 0 0 1.8-1.8v-2.2"/></svg></i><em data-i18n="editor_export">사진저장</em></button>
      <div class="posctl axis-v" id="posCtlV">
        <div class="plabel"><span id="selNameV">Eye</span><b id="posValV">50</b></div>
        <button class="pbtn" id="posPlusV">▲</button>
        <div class="pslot" id="pSlotV"><input type="range" id="posSliderV" min="0" max="1" step="0.0005" value="0.5" /></div>
        <button class="pbtn" id="posMinusV">▼</button>
      </div>
    </div>

    <!-- 아래 도크 (v1.11.0) — 사진보정 버튼 / 좌우 드래그 바 / 메뉴 버튼. 모두 오른쪽 정렬 -->
    <div class="bdock" id="bottomDock">
      <div class="modebtns" id="photoModes">
        <button data-mode="zoom" class="on" data-i18n="editor_zoom">줌</button>
        <button data-mode="vertical" data-i18n="editor_vertical">위아래</button>
        <button data-mode="horizontal" data-i18n="editor_horizontal">좌우</button>
        <button data-mode="balance" data-i18n="editor_balance">밸런스</button>
      </div>
      <!-- 좌우 드래그 바 행 (v1.29.0) — 바 **왼쪽**에 `다시 실행` · `되돌리기`.
           되돌리기를 바에 가장 가깝게 둡니다(제일 자주 씁니다). -->
      <div class="barrow">
      <button class="dockbtn" id="btnRedo"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M20 8.5h-9.5a5.5 5.5 0 0 0 0 11H16"/><path d="M16.5 4.5l4 4-4 4"/></svg></i><em data-i18n="editor_redo">다시 실행</em></button>
      <button class="dockbtn" id="btnUndo"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M4 8.5h9.5a5.5 5.5 0 0 1 0 11H8"/><path d="M7.5 4.5L3.5 8.5l4 4"/></svg></i><em data-i18n="editor_undo">되돌리기</em></button>
      <div class="posctl axis-h" id="posCtlH">
        <div class="plabel"><span id="selNameH">Center</span><b id="posValH">50</b></div>
        <button class="pbtn" id="posPlusH">▶</button>
        <div class="pslot" id="pSlotH"><input type="range" id="posSliderH" min="0" max="1" step="0.0005" value="0.5" /></div>
        <button class="pbtn" id="posMinusH">◀</button>
      </div>
      </div>
    </div>

    <!-- 왼쪽 아래 도크 — 프리셋 + 즐겨찾기 (v1.28.0)
         즐겨찾기(★)로 지정한 프리셋은 모달을 열지 않고 **바로 한 번에** 올릴 수 있게
         프리셋 버튼 바깥으로 꺼내 둡니다. 지정한 개수만큼만 나오고, 없으면 프리셋 버튼만 있습니다. -->
    <div class="ldock" id="leftDock">
      <div class="menurow" id="menuRow">
        <button id="btnPresetLoad"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.65l5.9-.85z"/></svg></i><em data-i18n="editor_preset">프리셋</em></button>
      </div>
      <div class="menurow favrow" id="favRow"></div>
    </div>

    <!-- 가운데 아래 도크 (v1.28.0) — `사진잠금` 이 화면 한가운데, 그 왼쪽에 `사진저장`.
         잠금은 이 앱의 모드 스위치라 손이 늘 같은 자리를 찾아가야 합니다. -->
    <div class="cdock" id="centerDock">
      <div class="menurow">
        <button id="btnLock"><i id="lockIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/><circle cx="12" cy="15.4" r="1.15" fill="currentColor" stroke="none"/></svg></i><em id="lockLabel" data-i18n="editor_photo_lock">사진잠금</em></button>
      </div>
    </div>

    <div class="hud" id="hud"></div>
    <div class="ov aistatus"><span class="chip" id="aiStatus" hidden></span></div>
  </div>

  <aside id="lineRail">
    <!-- 한/영 (v1.19.0) — 왼쪽 버튼들 맨 위. 다른 언어를 추가할 때도 이 줄에 칩을 더합니다 -->
    <div id="railLang">
      <button id="langKoR" data-lang="ko">한</button>
      <button id="langEnR" data-lang="en">영</button>
    </div>
    <div id="railExtra">
      <button class="chip" id="btnPivot" data-i18n="editor_inner_angle">V Center Pivot</button>
      <button class="chip" id="btnVAngle" data-i18n="editor_outer_angle">V Angle</button>
    </div>
  </aside>
</section>

<!-- ═══════════ MODALS ═══════════ -->
<div class="mask" id="mSave">
  <div class="modal">
    <h3 data-i18n="editor_preset_save">프리셋 저장</h3>
    <input type="text" id="saveName" maxlength="30" />
    <div class="modal-row">
      <button data-close="mSave" data-i18n="editor_cancel">취소</button>
      <button class="pri" id="doSave" data-i18n="editor_save">저장</button>
    </div>
  </div>
</div>

<div class="mask" id="mLoad">
  <div class="modal">
    <h3 data-i18n="editor_preset">프리셋</h3>
    <div class="plist" id="presetList"></div>
    <!-- 내보내기·가져오기 (v1.29.0) — 프리셋은 브라우저 localStorage 에만 있어
         기기를 바꾸거나 데이터를 지우면 사라집니다. 파일로 빼 두면 그대로 옮길 수 있습니다.
         버튼은 전부 테두리형 — 채운 버튼은 이 모달에서 `현재 설정 저장` 하나뿐입니다. -->
    <div class="modal-row" style="margin-bottom:8px">
      <button id="btnPresetExport" data-i18n="preset_export">내보내기</button>
      <button id="btnPresetImport" data-i18n="preset_import">가져오기</button>
    </div>
    <div class="modal-row">
      <button data-close="mLoad" data-i18n="editor_close">닫기</button>
      <button class="pri" id="btnPresetSave">＋ <span data-i18n="editor_preset_save">현재 설정 저장</span></button>
    </div>
  </div>
</div>

<div class="mask" id="mRename">
  <div class="modal">
    <h3 data-i18n="preset_rename">프리셋 이름 변경</h3>
    <input type="text" id="renameName" maxlength="30" />
    <div class="modal-row">
      <button data-close="mRename" data-i18n="editor_cancel">취소</button>
      <button class="pri" id="doRename" data-i18n="editor_save">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden />
<input type="file" id="presetFile" accept="application/json,.json" hidden />

<script src="./app.js"></script>
</body>
</html>
